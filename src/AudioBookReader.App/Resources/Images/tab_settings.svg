<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24">
  <!--
    Sliders rather than a cog.

    What this screen actually holds is a set of amounts — how hard the phone may work, how far the
    battery may fall, which model listens. A cog says "machinery"; sliders say "things you can move",
    which is what is behind the tab.

    Solid shapes only, for the same reason as the shelf: the icon is tinted flat.
  -->
  <rect x="3" y="5.2" width="18" height="2.2" rx="1.1" fill="#000000"/>
  <rect x="3" y="10.9" width="18" height="2.2" rx="1.1" fill="#000000"/>
  <rect x="3" y="16.6" width="18" height="2.2" rx="1.1" fill="#000000"/>
  <circle cx="8" cy="6.3" r="3" fill="#000000"/>
  <circle cx="16" cy="12" r="3" fill="#000000"/>
  <circle cx="10.5" cy="17.7" r="3" fill="#000000"/>
</svg>
