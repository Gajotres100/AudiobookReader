<!--
    What is on screen for the second before the library appears.

    The same book as the icon, on the same brass, because a splash that shows something else is a
    second identity for no reason. Larger and simpler: at this size the pages carry the shape on
    their own, so the text and the waveform are all it needs.
-->
<svg width="456" height="456" viewBox="0 0 456 456" version="1.1" xmlns="http://www.w3.org/2000/svg">
    <g fill="#FBF8F2">
        <path d="M 228 158 C 197 143, 148 141, 104 154 L 104 298 C 148 285, 197 287, 228 302 Z" />
        <path d="M 228 158 C 259 143, 308 141, 352 154 L 352 298 C 308 285, 259 287, 228 302 Z" />
    </g>

    <path d="M 228 158 L 228 302" stroke="#E4D9C4" stroke-width="7" stroke-linecap="round" />

    <g fill="#241F1A">
        <rect x="126" y="188" width="82" height="9" rx="4.5" />
        <rect x="126" y="212" width="82" height="9" rx="4.5" />
        <rect x="126" y="236" width="82" height="9" rx="4.5" />
        <rect x="126" y="260" width="52" height="9" rx="4.5" />
    </g>

    <g fill="#241F1A">
        <rect x="250" y="211" width="11" height="34" rx="5.5" />
