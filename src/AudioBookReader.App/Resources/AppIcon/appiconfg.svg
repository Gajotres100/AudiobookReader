<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<!--
    The app in one picture: an open book whose left page is text and whose right page is a voice.

    That is the whole idea of this program — the words and the narration are the same thing seen two
    ways — so the icon says it rather than showing a generic book or a generic speaker. Anyone who
    has used the app recognises what it does; anyone who has not can still tell it is about books.

    Drawn to survive being small. No gradients, no thin strokes, no detail below about four pixels
    at launcher size: at 48dp what is left is a cream book on brass with two textures in it, which
    is still legible and still nothing else on the phone.

    Everything sits inside the middle two thirds of the canvas, which is the only part an Android
    adaptive icon guarantees to show — the corners are cropped to whatever mask the launcher uses.
-->
<svg
    width="456"
    height="456"
    viewBox="0 0 456 456"
    version="1.1"
    xmlns="http://www.w3.org/2000/svg">

    <!--
        The pages. Two leaves meeting at the spine, each with a slight sag along the top and bottom
        so the book reads as held open rather than as two rectangles.
    -->
    <g fill="#FBF8F2">
        <path d="M 228 158
                 C 197 143, 148 141, 104 154
                 L 104 298
                 C 148 285, 197 287, 228 302
                 Z" />
        <path d="M 228 158
                 C 259 143, 308 141, 352 154
                 L 352 298
                 C 308 285, 259 287, 228 302
                 Z" />
    </g>

    <!--  The spine, one shade down: the fold, not a drawn line.  -->
    <path d="M 228 158 L 228 302" stroke="#E4D9C4" stroke-width="7" stroke-linecap="round" />

    <!--  The left page is text. Four lines, the last one short, the way a paragraph ends.  -->
    <g fill="#241F1A">
        <rect x="126" y="188" width="82" height="9" rx="4.5" />
        <rect x="126" y="212" width="82" height="9" rx="4.5" />
        <rect x="126" y="236" width="82" height="9" rx="4.5" />
        <rect x="126" y="260" width="52" height="9" rx="4.5" />
    </g>

    <!--
        The right page is the voice. A waveform rather than a speaker or a note, because what this
        app does to sound is measure it — and it is drawn from the middle out, so it balances the
        block of text opposite without weighing more than it.
    -->
    <g fill="#241F1A">
        <rect x="250" y="211" width="11" height="34" rx="5.5" />
        <rect x="272" y="195" width="11" height="66" rx="5.5" />
        <rect x="294" y="180" width="11" height="96" rx="5.5" />
        <rect x="316" y="199" width="11" height="58" rx="5.5" />
        <rect x="338" y="214" width="11" height="28" rx="5.5" />
    </g>
</svg>
