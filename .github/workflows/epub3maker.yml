# epub3maker: a Docker image on every change to it, and downloadable builds for a release.
#
#   image    ghcr.io/gajotres100/epub3maker:latest   (and :<version> for a release)
#   release  push a tag named epub3maker-v1.0 (or any epub3maker-v*) — Windows and Linux zips are
#            attached to a GitHub release of that name.

name: epub3maker

on:
  push:
    branches: [main]
    paths:
      - "tools/Epub3Maker/**"
      - "src/AudioBookReader.Core/**"
      - ".github/workflows/epub3maker.yml"
    tags: ["epub3maker-v*"]
  workflow_dispatch:

permissions:
  contents: write
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: tags
        run: |
          image=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/epub3maker
          tags="$image:latest"
          if [[ "$GITHUB_REF" == refs/tags/epub3maker-v* ]]; then
            tags="$tags,$image:${GITHUB_REF#refs/tags/epub3maker-v}"
          fi
          echo "tags=$tags" >> "$GITHUB_OUTPUT"

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: tools/Epub3Maker/Dockerfile
          push: true
          tags: ${{ steps.tags.outputs.tags }}

  release:
    if: startsWith(github.ref, 'refs/tags/epub3maker-v')
    runs-on: ubuntu-latest
    strategy:
      matrix:
        rid: [win-x64, linux-x64]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Publish
        run: |
          dotnet publish tools/Epub3Maker/Epub3Maker.csproj -c Release -r ${{ matrix.rid }} --self-contained -o out/epub3maker
          cp tools/Epub3Maker/README.md out/epub3maker/
          if [ "${{ matrix.rid }}" = "win-x64" ]; then cp tools/Epub3Maker/deploy/install-windows.ps1 out/epub3maker/; fi
          (cd out && zip -r ../epub3maker-${{ matrix.rid }}.zip epub3maker)

      - uses: softprops/action-gh-release@v2
        with:
          files: epub3maker-${{ matrix.rid }}.zip
